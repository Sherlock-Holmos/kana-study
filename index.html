<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f3f4f6"
  >

  <title>五十音抽认卡</title>

  <style>
    /* ==============================
       基础重置
       ============================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        max(16px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

      background: #f3f4f6;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      color: #202124;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }


    /* ==============================
       主容器
       ============================== */

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
    }


    /* ==============================
       标题
       ============================== */

    h1 {
      margin: 4px 0 6px;

      text-align: center;

      font-size: clamp(24px, 5vw, 30px);
      font-weight: 700;
      line-height: 1.25;
    }

    .subtitle {
      margin-bottom: clamp(14px, 3vw, 22px);

      text-align: center;

      color: #7a7f87;

      font-size: clamp(13px, 2.8vw, 15px);
    }


    /* ==============================
       主面板
       ============================== */

    .panel {
      width: 100%;

      padding: clamp(14px, 3vw, 22px);

      background: #ffffff;

      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: clamp(14px, 3vw, 20px);

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.06);
    }

/* ==============================
   顶部账号入口 + 登录弹窗
   ============================== */

    [hidden] {
      display: none !important;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: clamp(14px, 3vw, 22px);
    }

    .app-heading {
      min-width: 0;
    }

    .app-header h1 {
      margin: 0 0 5px;
      text-align: left;
    }

    .app-header .subtitle {
      margin: 0;
      text-align: left;
    }

    .account-trigger {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      max-width: min(48vw, 260px);
      min-height: 42px;
      padding: 7px 12px 7px 8px;
      background: rgba(255, 255, 255, 0.82);
      color: #31343a;
      border: 1px solid rgba(30, 35, 45, 0.10);
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(20, 25, 35, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .account-trigger:hover {
      background: #fff;
      border-color: rgba(30, 35, 45, 0.16);
    }

    .account-avatar {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #202124;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .account-trigger-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .account-sync-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #b6bac1;
    }

    .account-sync-dot.online {
      background: #4e9c62;
    }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    .auth-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(18, 20, 24, 0.48);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      animation: authFadeIn 0.16s ease-out;
    }

    .auth-dialog {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      max-height: min(720px, calc(100dvh - 36px));
      overflow: auto;
      padding: 24px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 22px;
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.22),
        0 4px 20px rgba(0, 0, 0, 0.08);
      animation: authPopIn 0.18s ease-out;
    }

    .auth-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      color: #747982;
      border: 1px solid #e7e8eb;
      border-radius: 50%;
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
    }

    .auth-dialog-title {
      margin: 2px 42px 6px 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #202124;
    }

    .auth-dialog-subtitle {
      margin-bottom: 22px;
      color: #838892;
      font-size: 13px;
      line-height: 1.55;
    }

    .auth-logged-out {
      display: grid;
      gap: 12px;
    }

    .auth-field-label {
      display: block;
      margin: 0 0 6px;
      color: #666b73;
      font-size: 12px;
      font-weight: 600;
    }

    .auth-input {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 11px 13px;
      background: #f8f9fa;
      color: #222;
      border: 1px solid #e0e2e6;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .auth-input:focus {
      background: #fff;
      border-color: #858b95;
      box-shadow: 0 0 0 4px rgba(31, 35, 42, 0.07);
    }

    .auth-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .auth-button {
      min-height: 46px;
      padding: 9px 14px;
      background: #f3f4f6;
      color: #42464d;
      border: 1px solid #e0e2e5;
      border-radius: 12px;
      white-space: nowrap;
    }

    .auth-button.primary {
      background: #202124;
      color: #fff;
      border-color: #202124;
    }

    .auth-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .auth-message {
      min-height: 18px;
      color: #7f848d;
      font-size: 12px;
      line-height: 1.45;
    }

    .auth-message.error {
      color: #b04444;
    }

    .auth-logged-in {
      display: grid;
      gap: 16px;
    }

    .account-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #f7f8fa;
      border: 1px solid #eceef1;
      border-radius: 14px;
    }

    .account-card-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #202124;
      color: white;
      font-size: 16px;
      font-weight: 750;
    }

    .user-info {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .user-info span {
      color: #8a8f97;
      font-size: 11px;
    }

    .user-info strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #25272b;
      font-size: 14px;
    }

    .sync-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      background: #fbfbfc;
      border: 1px solid #eceef1;
      border-radius: 12px;
    }

    .sync-row-label {
      color: #666b73;
      font-size: 12px;
    }

    .sync-status {
      color: #70757d;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
    }

    .logout-button {
      width: 100%;
      background: #fff5f5;
      color: #a94242;
      border-color: #f0d8d8;
    }

    body.auth-modal-open {
      overflow: hidden;
    }

    @keyframes authFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes authPopIn {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 600px) {
      .app-header {
        align-items: flex-start;
      }

      .account-trigger {
        max-width: 46vw;
      }

      .auth-dialog {
        width: min(100%, 390px);
        padding: 21px 18px 18px;
        border-radius: 20px;
      }
    }

    @media (max-width: 420px) {
      .app-header {
        gap: 10px;
      }

      .app-header h1 {
        font-size: 23px;
      }

      .app-header .subtitle {
        font-size: 12px;
      }

      .account-trigger {
        max-width: 44vw;
        padding-right: 10px;
      }

      .account-avatar {
        width: 26px;
        height: 26px;
      }

      .auth-buttons {
        grid-template-columns: 1fr;
      }
    }


    .study-settings {
      margin-bottom: 14px;
    }

    .study-settings-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      margin: -4px 0 12px;
      padding: 8px 2px;
      color: #4d5156;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .study-settings-summary::-webkit-details-marker {
      display: none;
    }

    .study-settings-summary::after {
      content: "⌄";
      flex: 0 0 auto;
      color: #92969d;
      font-size: 18px;
      transform: rotate(0deg);
      transition: transform 0.15s ease;
    }

    .study-settings[open] > .study-settings-summary::after {
      transform: rotate(180deg);
    }

    .study-settings-title {
      font-size: 14px;
      font-weight: 650;
    }

    .study-settings-current {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #92969d;
      font-size: 12px;
      text-align: right;
    }

    .study-settings-body {
      padding-top: 2px;
    }

    /* ==============================
       设置区
       ============================== */

    .settings {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(min(180px, 100%), 1fr)
        );

      gap: 12px;

      margin-bottom: 18px;
    }

    .setting-item {
      min-width: 0;
    }

    label,
    .section-title {
      display: block;

      margin-bottom: 7px;

      color: #6d7178;

      font-size: 13px;
      font-weight: 500;
    }

    select {
      width: 100%;
      min-height: 44px;

      padding: 9px 12px;

      background: #ffffff;
      color: #222;

      border: 1px solid #d9dce1;
      border-radius: 10px;

      font-family: inherit;
      font-size: 14px;

      outline: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    select:focus {
      border-color: #777;

      box-shadow:
        0 0 0 3px rgba(0, 0, 0, 0.06);
    }


    /* ==============================
       范围工具栏
       ============================== */

    .range-toolbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }

    .range-toolbar .section-title {
      margin: 0;
    }

    .small-actions {
      display: flex;

      flex-wrap: wrap;

      justify-content: flex-end;

      gap: 6px;
    }

    .mini-button {
      min-height: 34px;

      padding: 6px 10px;

      background: #f8f8f8;

      border: 1px solid #dedede;
      border-radius: 8px;

      color: #555;

      font-size: 12px;

      white-space: nowrap;
    }

    .mini-button.danger {
      color: #9b3434;
      background: #fff8f8;
      border-color: #efd4d4;
    }


    /* ==============================
       五十音范围
       ============================== */

    .groups {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 10px;
    }

    .group-button {
      flex: 0 0 auto;

      min-height: 38px;

      padding: 7px 14px;

      background: #ffffff;

      border: 1px solid #d4d7dc;
      border-radius: 999px;

      color: #555;

      font-size: 14px;
      font-weight: 500;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease,
        transform 0.1s ease;
    }

    .group-button.active {
      background: #222;
      color: #ffffff;

      border-color: #222;
    }

    .selected-info {
      min-height: 18px;

      margin-bottom: clamp(14px, 3vw, 20px);

      color: #92969d;

      font-size: 12px;
    }


    /* ==============================
       抽认卡
       ============================== */

    .card {
      width: 100%;

      height: clamp(220px, 35vh, 300px);
      min-height: 220px;

      padding: 20px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      margin-bottom: 16px;

      background:
        linear-gradient(
          145deg,
          #fbfbfc,
          #f7f7f8
        );

      border: 1px solid #eceef1;
      border-radius: clamp(14px, 3vw, 20px);

      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;

      overflow: hidden;

      transition:
        transform 0.12s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .question {
      max-width: 100%;

      font-size: clamp(72px, 18vw, 116px);

      font-weight: 500;
      line-height: 1;

      text-align: center;

      word-break: break-all;
    }

    .question.roman {
      font-size: clamp(48px, 13vw, 78px);

      font-weight: 600;
    }

    .answer {
      min-height: 40px;

      margin-top: clamp(14px, 3vw, 24px);

      font-size: clamp(25px, 7vw, 36px);

      font-weight: 650;
      line-height: 1.2;

      text-align: center;
    }

    .hint {
      min-height: 22px;

      margin-top: 10px;

      padding: 0 8px;

      color: #888d94;

      font-size: clamp(12px, 3vw, 14px);

      line-height: 1.5;

      text-align: center;
    }


    /* ==============================
       主操作按钮
       ============================== */

    .buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    button {
      min-height: 46px;

      border: none;
      border-radius: 11px;

      font-family: inherit;
      font-size: 15px;
      font-weight: 550;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.1s ease,
        filter 0.15s ease,
        background 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .show-answer {
      grid-column: span 2;

      background: #222;
      color: #ffffff;
    }

    .wrong {
      background: #f8e3e3;
      color: #9b3434;
    }

    .correct {
      background: #e1f2e3;
      color: #34703c;
    }

    .answer-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 9px;
      margin-top: 2px;
    }

    .answer-input {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 10px 14px;
      background: #fff;
      color: #202124;
      border: 1px solid #d8dbe0;
      border-radius: 11px;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    .answer-input:focus {
      border-color: #777d87;
      box-shadow: 0 0 0 4px rgba(31, 35, 42, 0.07);
    }

    .answer-submit {
      padding: 0 18px;
      background: #222;
      color: #fff;
    }

    .answer-skip {
      padding: 0 16px;
      background: #f7f7f8;
      color: #676b72;
      border: 1px solid #e2e3e6;
    }

    .answer-feedback {
      min-height: 22px;
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .answer-feedback.correct-feedback {
      color: #34703c;
    }

    .answer-feedback.wrong-feedback {
      color: #9b3434;
    }


    /* ==============================
       统计
       ============================== */

    .stats {
      margin-top: 20px;

      padding-top: 17px;

      border-top: 1px solid #eeeeee;
    }

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 6px 20px;
    }

    .stats-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;

      min-height: 30px;

      color: #646970;

      font-size: 14px;
    }

    .stats-row strong {
      color: #222;
      font-variant-numeric: tabular-nums;
    }

    .today-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 10px 12px;
      background: #f8f9fa;
      border: 1px solid #eceef1;
      border-radius: 10px;
      color: #70757c;
      font-size: 12px;
    }

    .today-summary strong {
      color: #35383d;
      font-weight: 650;
    }

    .weak-title {
      margin-top: 16px;
      margin-bottom: 9px;

      color: #70757c;

      font-size: 13px;
      font-weight: 500;
    }

    .weak-list {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      min-height: 30px;

      color: #8b8f95;
      font-size: 13px;
    }

    .weak-item {
      padding: 6px 10px;

      background: #f5f6f7;

      border: 1px solid #ececec;
      border-radius: 9px;

      color: #555;

      font-size: 13px;
    }


    /* ==============================
       底部提示
       ============================== */

    .footer-tip {
      margin-top: 16px;

      color: #a0a4aa;

      font-size: 12px;
      line-height: 1.7;

      text-align: center;
    }


    /* ==============================
       鼠标设备 hover
       ============================== */

    @media (hover: hover) {
      .card:hover {
        background: #f9f9fa;

        box-shadow:
          0 5px 18px rgba(0, 0, 0, 0.05);
      }

      .group-button:hover:not(.active) {
        background: #f5f5f5;
      }

      .mini-button:hover {
        background: #f1f1f1;
      }

      button:hover {
        filter: brightness(0.98);
      }
    }


    /* ==============================
       手机
       ============================== */

    @media (max-width: 600px) {
      body {
        padding-left:
          max(10px, env(safe-area-inset-left));

        padding-right:
          max(10px, env(safe-area-inset-right));
      }

      .panel {
        padding: 14px;
      }

      .study-settings {
        margin-bottom: 10px;
      }

      .study-settings-summary {
        margin-bottom: 8px;
      }

      .settings {
        grid-template-columns: 1fr;

        gap: 9px;

        margin-bottom: 14px;
      }

      .groups {
        gap: 7px;
      }

      .group-button {
        padding-left: 12px;
        padding-right: 12px;
      }

      .card {
        height: clamp(220px, 34vh, 270px);

        margin-bottom: 12px;
      }

      .stats {
        margin-top: 16px;
      }

      .answer-form {
        grid-template-columns: 1fr 1fr;
      }

      .answer-input {
        grid-column: 1 / -1;
      }
    }


    /* ==============================
       超窄手机
       ============================== */

    @media (max-width: 360px) {
      .range-toolbar {
        align-items: flex-start;

        flex-direction: column;
      }

      .small-actions {
        justify-content: flex-start;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .show-answer {
        grid-column: auto;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .question {
        font-size: clamp(66px, 22vw, 82px);
      }

      .question.roman {
        font-size: clamp(44px, 16vw, 60px);
      }
    }


    /* ==============================
       手机横屏 / 低高度
       ============================== */

    @media
      (max-height: 620px)
      and (orientation: landscape) {

      body {
        padding-top:
          max(8px, env(safe-area-inset-top));

        padding-bottom:
          max(8px, env(safe-area-inset-bottom));
      }

      h1 {
        margin: 0 0 2px;

        font-size: 20px;
      }

      .subtitle {
        margin-bottom: 8px;

        font-size: 12px;
      }

      .panel {
        padding: 12px;
      }

      .settings {
        margin-bottom: 10px;
      }

      .selected-info {
        margin-bottom: 8px;
      }

      .card {
        height: 150px;
        min-height: 150px;

        margin-bottom: 8px;
      }

      .question {
        font-size: clamp(56px, 17vh, 84px);
      }

      .question.roman {
        font-size: clamp(42px, 13vh, 64px);
      }

      .answer {
        margin-top: 8px;

        font-size: 24px;

function getUserStorageKey(
  userId
) {
  return `${USER_STORAGE_PREFIX}${userId}`;
}


function getActiveStorageKey() {
  return currentUser
    ? getUserStorageKey(
        currentUser.id
      )
    : STORAGE_KEY;
}


function getGuestMigrationKey(
  userId
) {
  return `${GUEST_MIGRATION_PREFIX}${userId}`;
}


function markGuestMigrationPending(
  userId,
  guestSnapshot
) {
  if (!guestSnapshot) {
    return;
  }

  try {
    localStorage.setItem(
      getGuestMigrationKey(userId),
      JSON.stringify({
        guestUpdatedAt:
          guestSnapshot.updatedAt || null
      })
    );
  } catch (error) {
    console.error(
      "记录游客迁移状态失败：",
      error
    );
  }
}


function completeGuestMigrationIfPending(
  userId
) {
  const migrationKey =
    getGuestMigrationKey(userId);

  let marker = null;

  try {
    const raw =
      localStorage.getItem(
        migrationKey
      );

    if (!raw) {
      return;
    }

    marker =
      JSON.parse(raw);
  } catch (error) {
    console.error(
      "读取游客迁移状态失败：",
      error
    );

    return;
  }

  const currentGuestSnapshot =
    readLocalSnapshot(
      STORAGE_KEY
    );

  /*
   * 如果游客记录在迁移过程中又被其他标签页更新，
   * 不删除新的游客记录，避免误伤。
   */
  const expectedUpdatedAt =
    marker?.guestUpdatedAt || null;

  const currentUpdatedAt =
    currentGuestSnapshot?.updatedAt || null;

  try {
    if (
      !currentGuestSnapshot ||
      currentUpdatedAt ===
        expectedUpdatedAt
    ) {
      localStorage.removeItem(
        STORAGE_KEY
      );
    }

    localStorage.removeItem(
      migrationKey
    );
  } catch (error) {
    console.error(
      "完成游客记录迁移失败：",
      error
    );
  }
}


function parseTimestamp(
  value
) {
  if (!value) {
    return 0;
  }

  const timestamp =
    Date.parse(value);

  return Number.isFinite(timestamp)
    ? timestamp
    : 0;
}


function readLocalSnapshot(
  storageKey
) {
  try {
    const raw =
      localStorage.getItem(
        storageKey
      );

    if (!raw) {
      return null;
    }

    return JSON.parse(raw);
  } catch (error) {
    console.error(
      "读取本地学习记录失败：",
      error
    );

    return null;
  }
}


function writeLocalSnapshot(
  storageKey,
  snapshot
) {
  try {
    localStorage.setItem(
      storageKey,
      JSON.stringify(snapshot)
    );

    return true;
  } catch (error) {
    console.error(
      "保存本地学习记录失败：",
      error
    );

    return false;
  }
}


function hasLearningData(
  snapshot
) {
  if (!snapshot) {
    return false;
  }

  if (
    Number(
      snapshot.stats?.total
    ) > 0
  ) {
    return true;
  }

  const perKana =
    snapshot.kanaStats;

  if (
    perKana &&
    typeof perKana === "object"
  ) {
    return Object.values(
      perKana
    ).some(stat =>
      Number(stat?.correct) > 0 ||
      Number(stat?.wrong) > 0 ||
      Number(stat?.mastery) > 0
    );
  }

  return false;
}


/* ========================================
   云端读取 / 保存
   ======================================== */

async function fetchCloudProgress(
  userId
) {
  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "user_progress"
      )
      .select(
        "progress, updated_at"
      )
      .eq(
        "user_id",
        userId
      )
      .maybeSingle();

  if (error) {
    throw error;
  }

  return data;
}


async function saveCloudProgress(
  snapshot = pendingCloudSnapshot
) {
  if (
    !currentUser ||
    !snapshot
  ) {
    return false;
  }

  const userId =
    currentUser.id;

  /*
   * 防止 await 期间切换了账号。
   */
  let snapshotToSave =
    typeof structuredClone === "function"
      ? structuredClone(snapshot)
      : JSON.parse(
          JSON.stringify(snapshot)
        );

  setSyncStatus(
    navigator.onLine
      ? "云端同步中…"
      : "离线 · 已保存本机"
  );

  if (!navigator.onLine) {
    pendingCloudSnapshot =
      snapshotToSave;

    return false;
  }

  try {
    const latestCloud =
      await fetchCloudProgress(
        userId
      );

    if (latestCloud?.progress) {
      snapshotToSave =
        mergeSnapshots(
          snapshotToSave,
          latestCloud.progress
        );
    }

    const updatedAt =
      new Date().toISOString();

    snapshotToSave.updatedAt =
      updatedAt;

    const {
      error
    } =
      await supabaseClient
        .from(
          "user_progress"
        )
        .upsert(
          {
            user_id:
              userId,

            progress:
              snapshotToSave,

            updated_at:
              updatedAt
          },
          {
            onConflict:
              "user_id"
          }
        );

    if (error) {
      throw error;
    }

    if (
      currentUser?.id ===
      userId
    ) {
      isApplyingExternalState = true;
      applyStateSnapshot(
        snapshotToSave,
        false
      );
      isApplyingExternalState = false;

      writeLocalSnapshot(
        getUserStorageKey(userId),
        snapshotToSave
      );
    }

    /*
     * 如果这是游客记录首次迁移到账号，
     * 只有云端确认写入成功后才清除原游客记录。
     */
    completeGuestMigrationIfPending(
      userId
    );

    /*
     * 如果同步期间已经切换账号，
     * 不改当前页面状态。
     */
    if (
      currentUser?.id ===
      userId
    ) {
      pendingCloudSnapshot =
        null;

      setSyncStatus(
        "云端已同步"
      );
    }

    return true;
  } catch (error) {
    console.error(
      "云端同步失败：",
      error
    );

    pendingCloudSnapshot =
      snapshotToSave;

    if (
      currentUser?.id ===
      userId
    ) {
      setSyncStatus(
        "同步失败 · 已保存本机"
      );
    }

    return false;
  }
}


function scheduleCloudSave(
  snapshot
) {
  if (!currentUser) {
    return;
  }

  pendingCloudSnapshot =
    snapshot;

  clearTimeout(
    cloudSaveTimer
  );

  cloudSaveTimer =
    setTimeout(
      () => {
        cloudSaveTimer = null;
        void saveCloudProgress();
      },
      CLOUD_SYNC_DELAY_MS
    );

  setSyncStatus(
    navigator.onLine
      ? "待同步…"
      : "离线 · 已保存本机"
  );
}


async function flushCloudSave() {
  if (!currentUser) {
    return;
  }

  if (cloudSaveTimer) {
    clearTimeout(
      cloudSaveTimer
    );

    cloudSaveTimer = null;
  }

  if (pendingCloudSnapshot) {
    await saveCloudProgress(
      pendingCloudSnapshot
    );
  }
}

async function activateUserContext(
  user
) {
  if (!user) {
    return;
  }

  if (
    activeUserContextId ===
    user.id
  ) {
    return;
  }

  activeUserContextId =
    user.id;

  currentUser =
    user;

  renderAuthState();
  setSyncStatus(
    "正在读取云端…"
  );

  const userStorageKey =
    getUserStorageKey(
      user.id
    );

  const userLocalSnapshot =
    readLocalSnapshot(
      userStorageKey
    );

  const guestSnapshot =
    readLocalSnapshot(
      STORAGE_KEY
    );

  let cloudRow = null;

  try {
    cloudRow =
      await fetchCloudProgress(
        user.id
      );
  } catch (error) {
    console.error(
      "读取云端学习记录失败：",
      error
    );

    /*
     * 云端暂时不可用：
     * 优先继续使用该账号在本机的记录。
     */
    if (userLocalSnapshot) {
      isApplyingExternalState =
        true;

      applyStateSnapshot(
        userLocalSnapshot
      );

      isApplyingExternalState =
        false;

      setSyncStatus(
        "云端不可用 · 使用本机记录"
      );

      return;
    }

    /*
     * 首次登录且没有账号本地记录，
     * 暂时沿用游客记录。
     */
    if (guestSnapshot) {
      /*
       * 先保留游客原记录。
       * 等之后真正同步到云端成功，再清理游客副本。
       */
      markGuestMigrationPending(
        user.id,
        guestSnapshot
      );

      isApplyingExternalState =
        true;

      applyStateSnapshot(
        guestSnapshot
      );

      isApplyingExternalState =
        false;

      writeLocalSnapshot(
        userStorageKey,
        createStateSnapshot(
          guestSnapshot.updatedAt ||
          new Date().toISOString()
        )
      );
    }

    setSyncStatus(
      "云端不可用 · 已保存本机"
    );

    return;
  }

  const cloudSnapshot =
    cloudRow?.progress ?? null;

  /*
   * 云端 + 本机都有记录：
   * 不再整份覆盖，而是合并每台设备的答题计数，
   * 每个假名的掌握状态采用最近复习的一份。
   */
  if (
    cloudSnapshot &&
    userLocalSnapshot
  ) {
    const mergedSnapshot =
      mergeSnapshots(
        userLocalSnapshot,
        cloudSnapshot
      );

    isApplyingExternalState =
      true;
    applyStateSnapshot(
      mergedSnapshot
    );
    isApplyingExternalState =
      false;

    writeLocalSnapshot(
      userStorageKey,
      mergedSnapshot
    );

    await saveCloudProgress(
      mergedSnapshot
    );

    return;
  }

  /*
   * 只有云端记录：下载到本机。
   */
  if (cloudSnapshot) {
    isApplyingExternalState =
      true;

    applyStateSnapshot(
      cloudSnapshot
    );

    isApplyingExternalState =
      false;

    const normalizedCloud =
      createStateSnapshot(
        cloudRow.updated_at ||
        cloudSnapshot.updatedAt ||
        new Date().toISOString()
      );

    writeLocalSnapshot(
      userStorageKey,
      normalizedCloud
    );

    completeGuestMigrationIfPending(
      user.id
    );

    setSyncStatus(
      "云端已同步"
    );

    return;
  }

  /*
   * 只有账号本地记录：上传云端。
   */
  if (userLocalSnapshot) {
    isApplyingExternalState =
      true;

    applyStateSnapshot(
      userLocalSnapshot
    );

    isApplyingExternalState =
      false;

    await saveCloudProgress(
      createStateSnapshot(
        userLocalSnapshot.updatedAt ||
        new Date().toISOString()
      )
    );

    return;
  }

  /*
   * 账号本地和云端都没有：
   * 第一次登录时把游客进度迁移到账号。
   *
   * 注意：这里只“标记待迁移”，不会马上删除游客数据。
   * 必须等 Supabase 写入成功后才清除游客副本。
   */
  if (guestSnapshot) {
    markGuestMigrationPending(
      user.id,
      guestSnapshot
    );

    isApplyingExternalState =
      true;

    applyStateSnapshot(
      guestSnapshot
    );

    isApplyingExternalState =
      false;
  }

  const initialSnapshot =
    createStateSnapshot(
      guestSnapshot?.updatedAt ||
      new Date().toISOString()
    );

  writeLocalSnapshot(
    userStorageKey,
    initialSnapshot
  );

  await saveCloudProgress(
    initialSnapshot
  );
}


function switchToGuestContext() {
  activeUserContextId =
    null;

  currentUser =
    null;

  pendingCloudSnapshot =
    null;

  clearTimeout(
    cloudSaveTimer
  );

  cloudSaveTimer =
    null;

  renderAuthState();

  const loaded =
    loadState(
      STORAGE_KEY

  /*
   * 游客有自己的历史记录就恢复游客记录；
   * 如果游客记录已经成功迁移到账号并被清除，
   * 退出后显示全新的游客状态。
   *
   * 账号的本地缓存和 Supabase 云端数据都不会删除。
   */
  if (!loaded) {
    resetLearningState();
    refreshLearningUI();
  }
}


/* ========================================
   注册
   ======================================== */

async function registerAccount() {
  const email =
    authEmailEl.value
      .trim();

  const password =
    authPasswordEl.value;

  if (!email) {
    setAuthMessage(
      "请输入邮箱。",
      true
    );

    authEmailEl.focus();
    return;
  }

  if (password.length < 8) {
    setAuthMessage(
      "密码至少需要 8 位。",
      true
    );

    authPasswordEl.focus();
    return;
  }

  setAuthBusy(true);
  setAuthMessage(
    "正在注册……"
  );

  try {
    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signUp({
          email,
          password
        });

    if (error) {
      setAuthMessage(
        `注册失败：${error.message}`,
        true
      );
      return;
    }

    currentUser =
      data.session?.user ?? null;

    authPasswordEl.value =
      "";

    if (currentUser) {
      setAuthMessage("");
      renderAuthState();

      await activateUserContext(
        currentUser
      );

      closeAuthModal();
    } else {
      setAuthMessage(
        "注册成功，但当前未自动登录。请确认 Supabase 的 Confirm email 已关闭，或完成邮箱验证后再登录。"
      );
    }
  } catch (error) {
    console.error(
      "注册异常：",
      error
    );

    setAuthMessage(
      "注册失败，请检查网络后重试。",
      true
    );
  } finally {
    setAuthBusy(false);
  }
}

/* ========================================
   初始化 Supabase 登录状态
   ======================================== */

async function initializeAuth() {
  try {
    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();

    if (error) {
      console.error(
        "读取登录状态失败：",
        error
      );
    }

    const sessionUser =
      data?.session?.user ?? null;

    if (sessionUser) {
      currentUser =
        sessionUser;

      renderAuthState();

      await activateUserContext(
        sessionUser
      );
    } else {
      renderAuthState();
    }

    supabaseClient
      .auth
      .onAuthStateChange(
        (
          event,
          session
        ) => {
          const nextUser =
            session?.user ?? null;

          if (
            event === "SIGNED_OUT"
          ) {
            switchToGuestContext();
            setAuthMessage("");
            return;
          }

          if (nextUser) {
            currentUser =
              nextUser;

            renderAuthState();

            void activateUserContext(
              nextUser
            );
          }
        }
      );
  } catch (error) {
    console.error(
      "初始化认证失败：",
      error
    );

    switchToGuestContext();
  }
}

    function getOrCreateDeviceId() {
      if (deviceId) {
        return deviceId;
      }

      try {
        const existing =
          localStorage.getItem(
            DEVICE_ID_KEY
          );

        if (existing) {
          deviceId = existing;
          return deviceId;
        }

        deviceId =
          typeof crypto?.randomUUID === "function"
            ? crypto.randomUUID()
            : `device-${Date.now()}-${Math.random().toString(36).slice(2)}`;

        localStorage.setItem(
          DEVICE_ID_KEY,
          deviceId

        deviceId =
          `device-${Date.now()}-${Math.random().toString(36).slice(2)}`;

          totals.wrong;

        correct +=
          totals.correct;

        wrong +=
          totals.wrong;
      });

      stats = {
        total:
          correct + wrong,
        correct,
        wrong
      };
    }


    function migrateLegacyCounters(
      saved
    ) {
      const counters =
        cloneValue(
          saved?.syncCounters || {}
        );

      if (saved?.syncCounters) {
        return counters;
      }

      kanaData.forEach(item => {
        const old =
          saved?.kanaStats?.[
            item.kana
          ];

        const correct =
          Number(old?.correct) || 0;

        const wrong =
          Number(old?.wrong) || 0;

        if (
          correct === 0 &&
          wrong === 0
        ) {
          return;
        }

        counters[
          item.kana
        ] = {
          legacy: {
            correct,
            wrong
          }
        };
      });

      return counters;
    }


    function mergeDeviceCounterMap(
      first,
      second
    ) {
      const merged = {};
      const deviceIds =
        new Set([
          ...Object.keys(first || {}),
          ...Object.keys(second || {})
        ]);

      deviceIds.forEach(id => {
        merged[id] = {
          correct:
            Math.max(
              Number(first?.[id]?.correct) || 0,
              Number(second?.[id]?.correct) || 0
            ),
          wrong:
            Math.max(
              Number(first?.[id]?.wrong) || 0,
              Number(second?.[id]?.wrong) || 0
            )
        };
      });

      return merged;
    }


    function mergeSyncCounters(
      first,
      second
    ) {
      const merged = {};

      kanaData.forEach(item => {
        const deviceMap =
          mergeDeviceCounterMap(
            first?.[item.kana],
            second?.[item.kana]
          );

        if (
          Object.keys(deviceMap).length > 0
        ) {
          merged[item.kana] =
            deviceMap;
        }
      });

      return merged;
    }


    function mergeDailyCounters(
      first,
      second
    ) {
      const merged = {};
      const dates =
        new Set([
          ...Object.keys(first || {}),
          ...Object.keys(second || {})
        ]);

      dates.forEach(date => {
        merged[date] =
          mergeDeviceCounterMap(
            first?.[date],
            second?.[date]
          );
      });

      return merged;
    }


    function normalizedKanaState(
      snapshot,
      item
    ) {
      const old =
        snapshot?.kanaStats?.[
          item.kana
        ] || {};

      const correct =
        Number(old.correct) || 0;

      const wrong =
        Number(old.wrong) || 0;

      const mastery =
        old.mastery !== undefined &&
        Number.isFinite(
          Number(old.mastery)
        )
          ? Math.max(
              0,
              Math.min(
                MAX_MASTERY,
                Number(old.mastery)
              )
            )
          : inferMastery(
              correct,
              wrong
            );

      return {
        correct,
        wrong,
        streak:
          Number(old.streak) || 0,
        mastery,
        lastResult:
          [
            "correct",
            "wrong"
          ].includes(old.lastResult)
            ? old.lastResult
            : null,
        lastReviewedAt:
          old.lastReviewedAt || null,
        nextReviewAt:
          old.nextReviewAt || null
      };
    }


    function mergeSnapshots(
      first,
      second
    ) {
      if (!first) {
        return cloneValue(second);
      }

      if (!second) {
        return cloneValue(first);
      }

      const firstCounters =
        migrateLegacyCounters(first);

      const secondCounters =
        migrateLegacyCounters(second);

      const mergedCounters =
        mergeSyncCounters(
          firstCounters,
          secondCounters
        );

      const mergedKanaStats = {};

      kanaData.forEach(item => {
        const firstState =
          normalizedKanaState(
            first,
            item
          );

        const secondState =
          normalizedKanaState(
            second,
            item
          );

        const firstTime =
          parseTimestamp(
            firstState.lastReviewedAt ||
            first.updatedAt
          );

        const secondTime =
          parseTimestamp(
            secondState.lastReviewedAt ||
            second.updatedAt
          );

        const latestState =
          secondTime > firstTime
            ? secondState
            : firstState;

        const totals =
          sumDeviceCounters(
            mergedCounters[
              item.kana
            ]
          );

        mergedKanaStats[
          item.kana
        ] = {
          ...latestState,
          correct:
            totals.correct,
          wrong:
            totals.wrong
        };
      });

      const totalCorrect =
        Object.values(
          mergedKanaStats
        ).reduce(
          (sum, item) =>
            sum + item.correct,
          0
        );

      const totalWrong =
        Object.values(
          mergedKanaStats
        ).reduce(
          (sum, item) =>
            sum + item.wrong,
          0
        );

      const firstSettingsTime =
        parseTimestamp(
          first.settingsUpdatedAt ||
          first.updatedAt
        );

      const secondSettingsTime =
        parseTimestamp(
          second.settingsUpdatedAt ||
          second.updatedAt
        );

      const settingsSource =
        secondSettingsTime >
        firstSettingsTime
          ? second
          : first;

      const latestUpdatedAt =
        Math.max(
          parseTimestamp(first.updatedAt),
          parseTimestamp(second.updatedAt),
          Date.now()
        );

      return {
        version:
          STORAGE_VERSION,
        selectedGroups:
          Array.isArray(
            settingsSource.selectedGroups
          )
            ? [...settingsSource.selectedGroups]
            : ["a", "ka", "sa"],
        stats: {
          total:
            totalCorrect + totalWrong,
          correct:
            totalCorrect,
          wrong:
            totalWrong
        },
        kanaStats:
          mergedKanaStats,
        syncCounters:
          mergedCounters,
        dailyCounters:
          mergeDailyCounters(
            first.dailyCounters,
            second.dailyCounters
          ),
        mode:
          settingsSource.mode ||
          "kanaToRoman",
        weightMode:
          settingsSource.weightMode ||
          "weighted",
        answerMode:
          settingsSource.answerMode ||
          "self",
        settingsUpdatedAt:
          settingsSource.settingsUpdatedAt ||
          settingsSource.updatedAt ||
          new Date().toISOString(),
        updatedAt:
          new Date(
            latestUpdatedAt
          ).toISOString()
      };
    }


    function createStateSnapshot(
      updatedAt =
        new Date().toISOString()
    ) {
      recalculateCountsFromCounters();

      return {
        version:
          STORAGE_VERSION,
        selectedGroups:
          [...selectedGroups],
        stats:
          cloneValue(stats),
        kanaStats:
          cloneValue(kanaStats),
        syncCounters:
          cloneValue(syncCounters),
        dailyCounters:
          cloneValue(dailyCounters),
        mode:
          modeEl.value,
        weightMode:
          weightModeEl.value,
        answerMode:
          answerModeEl.value,
        settingsUpdatedAt,
        updatedAt
      };
    }


    function saveState() {
      const snapshot =
        createStateSnapshot();

      const storageKey =
        getActiveStorageKey();

      writeLocalSnapshot(
        storageKey,
        snapshot
      );

      /*
       * 游客只存 localStorage。
       * 登录用户在本地保存后，
       * 再进行 1 秒防抖云同步。
       */
      if (
        currentUser &&
        !isApplyingExternalState
      ) {
        scheduleCloudSave(
          snapshot
        );
      }

      return snapshot;
    }


    /* ========================================
       从旧数据推算掌握度
       ======================================== */

    function inferMastery(
      correct,
      wrong
    ) {

      const total =
        correct + wrong;


      if (total === 0) {
        return 0;
      }


      const accuracy =
        correct / total;


      if (
        correct >= 8 &&
        accuracy >= 0.92
      ) {
        return 5;
      }


      if (
        correct >= 5 &&
        accuracy >= 0.85
      ) {
        return 4;
      }


      if (
        correct >= 3 &&
        accuracy >= 0.75
      ) {
        return 3;
      }


      if (
        accuracy >= 0.65
      ) {
        return 2;
      }


      if (
        accuracy >= 0.5
      ) {
        return 1;
      }


      return 0;

    }


    /* ========================================
       读取状态
       ======================================== */

    function resetLearningState() {
      selectedGroups =
        new Set([
          "a",
          "ka",
          "sa"
        ]);

      stats = {
        total: 0,
        correct: 0,
        wrong: 0
      };

      kanaStats =
        createDefaultKanaStats();

      syncCounters = {};

      dailyCounters = {};

      modeEl.value =
        "kanaToRoman";

      weightModeEl.value =
        "weighted";

      answerModeEl.value =
        "self";

      settingsUpdatedAt =
        new Date().toISOString();
    }


    function applyStateSnapshot(
      saved,
      refresh = true
    ) {
      resetLearningState();

      if (
        !saved ||
        typeof saved !== "object"
      ) {
        if (refresh) {
          refreshLearningUI();
        }
        return false;
      }

      if (
        Array.isArray(
          saved.selectedGroups
        )
      ) {
        selectedGroups =
          new Set(
            saved.selectedGroups
          );
      }

      syncCounters =
        migrateLegacyCounters(
          saved
        );

      dailyCounters =
        cloneValue(
          saved.dailyCounters || {}
        );

      if (saved.kanaStats) {
        kanaData.forEach(item => {
          const normalized =
            normalizedKanaState(
              saved,
              item
            );

          kanaStats[
            item.kana
          ] = normalized;
        });
      }

      recalculateCountsFromCounters();

      if (
        [
          "kanaToRoman",
          "romanToKana",
          "random"
        ].includes(
          saved.mode
        )
      ) {
        modeEl.value =
          saved.mode;
      }

      if (
        [
          "weighted",
          "pure"
        ].includes(
          saved.weightMode
        )
      ) {
        weightModeEl.value =
          saved.weightMode;
      }

      if (
        [
          "self",
          "input"
        ].includes(
          saved.answerMode
        )
      ) {
        answerModeEl.value =
          saved.answerMode;
      }

      settingsUpdatedAt =
        saved.settingsUpdatedAt ||
        saved.updatedAt ||
        new Date().toISOString();

      if (refresh) {
        refreshLearningUI();
      } else {
        syncGroupButtons();
        updateStats();
        updateSelectedInfo();
        renderAnswerModeUI();
      }

      return true;
    }


    function refreshLearningUI() {
      syncGroupButtons();
      updateStats();
      updateSelectedInfo();
      nextCard();
    }


    function loadState(
      storageKey =
        getActiveStorageKey()
    ) {
      const saved =
        readLocalSnapshot(
          storageKey
        );

      if (!saved) {
        return false;
      }

      const applied =
        applyStateSnapshot(
          saved
        );

      if (
        applied &&
        Number(saved.version) <
          STORAGE_VERSION
      ) {
        writeLocalSnapshot(
          storageKey,
          createStateSnapshot(
            saved.updatedAt ||
            new Date().toISOString()
          )
        );
      }

      return applied;
    }


    /* ========================================
       同步范围按钮
       ======================================== */

    function syncGroupButtons() {

      groupButtons.forEach(
        button => {

          const group =
            button.dataset.group;


          button.classList.toggle(
            "active",
            selectedGroups.has(
              group
            )
          );

        }
      );

    }


    /* ========================================
       当前可抽取假名
       ======================================== */

    function getAvailableItems() {

      return kanaData.filter(
        item =>
          selectedGroups.has(
            item.group
          )
      );

    }


    /* ========================================
       普通随机
       ======================================== */

    function pureRandom(items) {

      if (
        items.length === 0
      ) {
        return null;
      }


      const index =
        Math.floor(
          Math.random() *
          items.length
        );


      return items[index];

    }


    /* ========================================
       计算掌握度权重
       ======================================== */

    function getItemWeight(
      item
    ) {
      const stat =
        kanaStats[
          item.kana
        ];

      let weight =
        MAX_MASTERY -
        stat.mastery +
        1;

      if (
        stat.lastResult ===
        "wrong"
      ) {
        weight += 3;
      }

      const nextReviewTime =
        parseTimestamp(
          stat.nextReviewAt
        );

      if (
        nextReviewTime > 0 &&
        nextReviewTime <= Date.now()
      ) {
        weight += 4;
      } else if (
        nextReviewTime > Date.now() &&
        stat.mastery >= 3
      ) {
        weight *= 0.55;
      }

      return Math.max(
        0.5,
        weight
      );
    }


    /* ========================================
       加权随机
       ======================================== */

    function weightedRandom(
      items
    ) {

      /*
       * 不直接构建巨大数组，
       * 使用总权重随机，
       * 后面数据增加也比较合适。
       */

      const weightedItems =
        items.map(
          item => ({
            item,
            weight:
              getItemWeight(
                item
              )
          })
        );


      const totalWeight =
        weightedItems.reduce(
          (
            total,
            entry
          ) =>
            total +
            entry.weight,
          0
        );


      let random =
        Math.random() *
        totalWeight;


      for (
        const entry
        of weightedItems
      ) {

        random -=
          entry.weight;


        if (
          random <= 0
        ) {

          return entry.item;

        }

      }


      return items[
        items.length - 1
      ];

    }


    /* ========================================
       获取随机题
       ======================================== */

    function getRandomItem() {

      const items =
        getAvailableItems();


      if (
        items.length === 0
      ) {

        return null;

      }


      if (
        weightModeEl.value ===
        "weighted"
      ) {

        return weightedRandom(
          items
        );

      }


      return pureRandom(
        items
      );

    }


    /* ========================================
       测试方向
       ======================================== */

    function getDirection() {

      if (
        modeEl.value ===
        "random"
      ) {

        return (
          Math.random() >
          0.5
        )
          ? "kanaToRoman"
          : "romanToKana";

      }


      return modeEl.value;

    }


    /* ========================================
       下一题
       ======================================== */

    function renderAnswerModeUI() {
      const isInputMode =
        answerModeEl.value ===
        "input";

      answerFormEl.hidden =
        !isInputMode;

      selfButtonsEl.hidden =
        isInputMode;

      answerFeedbackEl.hidden =
        !isInputMode;

      if (isInputMode) {
        cardEl.setAttribute(
          "aria-label",
          "题目卡片"
        );
        cardEl.tabIndex = -1;
      } else {
        cardEl.setAttribute(
          "aria-label",
          "点击显示答案"
        );
        cardEl.tabIndex = 0;
      }
    }


    function resetAnswerInputUI() {
      inputAnswerRecorded = false;
      answerInputEl.value = "";
      answerInputEl.disabled = false;
      submitAnswerEl.textContent =
        "提交";
      dontKnowInputEl.hidden = false;
      answerFeedbackEl.textContent = "";
      answerFeedbackEl.className =
        "answer-feedback";
    }


    function nextCard() {
      currentItem =
        getRandomItem();

      answerVisible = false;
      answerEl.textContent = "";
      questionEl.classList.remove(
        "roman"
      );

      resetAnswerInputUI();
      renderAnswerModeUI();

      if (!currentItem) {
        questionEl.textContent =
          "—";
        hintEl.textContent =
          "请至少选择一个背诵范围";
        answerInputEl.disabled = true;
        return;
      }

      currentDirection =
        getDirection();

      if (
        currentDirection ===
        "kanaToRoman"
      ) {
        questionEl.textContent =
          currentItem.kana;
      } else {
        questionEl.textContent =
          currentItem.roman;
        questionEl.classList.add(
          "roman"
        );
      }

      if (
        answerModeEl.value ===
        "input"
      ) {
        hintEl.textContent =
          currentDirection ===
          "kanaToRoman"
            ? "输入罗马音后按 Enter"
            : "输入对应平假名后按 Enter";

        answerInputEl.placeholder =
          currentDirection ===
          "kanaToRoman"
            ? "例如：shi"
            : "例如：し";

        if (
          window.matchMedia?.(
            "(pointer: fine)"
          ).matches
        ) {
          requestAnimationFrame(
            () =>
              answerInputEl.focus()
          );
        }
      } else {
        hintEl.textContent =
          "点击卡片或按空格查看答案";
      }
    }


    function showAnswer(
      force = false
    ) {
      if (!currentItem) {
        return;
      }

      if (
        answerModeEl.value ===
          "input" &&
        !force
      ) {
        answerInputEl.focus();
        return;
      }

      answerVisible = true;

      answerEl.textContent =
        currentDirection ===
        "kanaToRoman"
          ? currentItem.roman
          : currentItem.kana;

      const stat =
        kanaStats[
          currentItem.kana
        ];

      hintEl.textContent =
        `${currentItem.memory} ｜ 掌握度 ${stat.mastery}/${MAX_MASTERY}`;
    }


    function getAcceptedTypedAnswers() {
      if (!currentItem) {
        return [];
      }

      if (
        currentDirection ===
        "romanToKana"
      ) {
        return [
          currentItem.kana
        ];
      }

      const alternatives = {
        "し": ["shi", "si"],
        "ち": ["chi", "ti"],
        "つ": ["tsu", "tu"],
        "ふ": ["fu", "hu"],
        "を": ["o", "wo"]
      };

      return alternatives[
        currentItem.kana
      ] || [
        currentItem.roman
      ];
    }


    function normalizeTypedAnswer(
      value
    ) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "");
    }


    function submitTypedAnswer() {
      if (!currentItem) {
        return;
      }

      if (inputAnswerRecorded) {
        nextCard();
        return;
      }

      const value =
        normalizeTypedAnswer(
          answerInputEl.value
        );

      if (!value) {
        answerFeedbackEl.textContent =
          "先输入答案；如果不会，可以点“不会”。";
        answerFeedbackEl.className =
          "answer-feedback wrong-feedback";
        answerInputEl.focus();
        return;
      }

      const accepted =
        getAcceptedTypedAnswers()
          .map(
            normalizeTypedAnswer
          );

      const isCorrect =
        accepted.includes(value);

      recordAnswerResult(
        isCorrect
      );

      showAnswer(true);
      inputAnswerRecorded = true;
      answerInputEl.disabled = true;
      dontKnowInputEl.hidden = true;
      submitAnswerEl.textContent =
        "下一题";

      answerFeedbackEl.textContent =
        isCorrect
          ? "✓ 正确"
          : `✕ 错误，正确答案：${currentDirection === "kanaToRoman" ? currentItem.roman : currentItem.kana}`;

      answerFeedbackEl.className =
        `answer-feedback ${isCorrect ? "correct-feedback" : "wrong-feedback"}`;
    }


    function markTypedDontKnow() {
      if (
        !currentItem ||
        inputAnswerRecorded
      ) {
        return;
      }

      recordAnswerResult(false);
      showAnswer(true);
      inputAnswerRecorded = true;
      answerInputEl.disabled = true;
      dontKnowInputEl.hidden = true;
      submitAnswerEl.textContent =
        "下一题";
      answerFeedbackEl.textContent =
        "已记为不认识，先看一遍联想再继续。";
      answerFeedbackEl.className =
        "answer-feedback wrong-feedback";
    }


    /* ========================================
       更新掌握度
       ======================================== */

    function updateKanaMastery(
      item,
      isCorrect
    ) {
      const stat =
        kanaStats[
          item.kana
        ];

      if (isCorrect) {
        stat.streak++;
        stat.lastResult =
          "correct";

        if (
          stat.streak >= 2
        ) {
          stat.mastery =
            Math.min(
              MAX_MASTERY,
              stat.mastery + 1
            );
          stat.streak = 0;
        }
      } else {
        stat.streak = 0;
        stat.lastResult =
          "wrong";
        stat.mastery =
          Math.max(
            0,
            stat.mastery - 2
          );
      }

      const now = new Date();
      stat.lastReviewedAt =
        now.toISOString();

      const delay =
        isCorrect
          ? REVIEW_INTERVAL_MS[
              stat.mastery
            ]
          : 5 * 60 * 1000;

      stat.nextReviewAt =
        new Date(
          now.getTime() + delay
        ).toISOString();
    }


    function incrementReviewCounters(
      item,
      isCorrect
    ) {
      const currentDeviceId =
        getOrCreateDeviceId();

      syncCounters[
        item.kana
      ] ||= {};

      syncCounters[
        item.kana
      ][currentDeviceId] ||= {
        correct: 0,
        wrong: 0
      };

      syncCounters[
        item.kana
      ][currentDeviceId][
        isCorrect
          ? "correct"
          : "wrong"
      ]++;

      const dateKey =
        getLocalDateKey();

      dailyCounters[dateKey] ||= {};
      dailyCounters[dateKey][
        currentDeviceId
      ] ||= {
        correct: 0,
        wrong: 0
      };

      dailyCounters[dateKey][
        currentDeviceId
      ][
        isCorrect
          ? "correct"
          : "wrong"
      ]++;
    }


    function recordAnswerResult(
      isCorrect
    ) {
      if (!currentItem) {
        return;
      }

      incrementReviewCounters(
        currentItem,
        isCorrect
      );

      updateKanaMastery(
        currentItem,
        isCorrect
      );

      recalculateCountsFromCounters();
      saveState();
      updateStats();
      updateSelectedInfo();
    }


    function markAnswer(
      isCorrect
    ) {
      if (!currentItem) {
        return;
      }

      if (
        answerModeEl.value ===
        "input"
      ) {
        return;
      }

      if (!answerVisible) {
        showAnswer();
        return;
      }

      recordAnswerResult(
        isCorrect
      );

      nextCard();
    }


    /* ========================================
       更新统计
       ======================================== */

    function updateStats() {

      totalEl.textContent =
        stats.total;


      correctCountEl.textContent =
        stats.correct;


      wrongCountEl.textContent =
        stats.wrong;


      const accuracy =
        stats.total === 0
          ? 0
          : Math.round(
              stats.correct /
              stats.total *
              100
            );


      accuracyEl.textContent =
        accuracy + "%";

      updateDailySummary();

      updateWeakList();

    }


    function getDailyTotals(
      dateKey
    ) {
      return sumDeviceCounters(
        dailyCounters[
          dateKey
        ]
      );
    }


    function getStudyStreak() {
      let streak = 0;
      const cursor =
        new Date();

      while (streak < 3660) {
        const dateKey =
          getLocalDateKey(
            cursor
          );

        const totals =
          getDailyTotals(
            dateKey
          );

        if (
          totals.correct +
          totals.wrong === 0
        ) {
          break;
        }

        streak++;
        cursor.setDate(
          cursor.getDate() - 1
        );
      }

      return streak;
    }


    function updateDailySummary() {
      const today =
        getDailyTotals(
          getLocalDateKey()
        );

      const total =
        today.correct +
        today.wrong;

      const accuracy =
        total === 0
          ? 0
          : Math.round(
              today.correct /
              total * 100
            );

      todaySummaryEl.textContent =
        `今日 ${total} 题 · 正确率 ${accuracy}%`;

      studyStreakEl.textContent =
        `连续 ${getStudyStreak()} 天`;
    }


    /* ========================================
       薄弱假名
       ======================================== */

    function updateWeakList() {

      const weakItems =
        kanaData

          /*
           * 必须练过
           */
          .filter(
            item => {

              const stat =
                kanaStats[
                  item.kana
                ];


              return (
                stat.correct +
                stat.wrong >
                0
              ) &&
              stat.mastery <
                MAX_MASTERY;

            }
          )

          /*
           * 排序优先级：
           *
           * 1. 掌握度低
           * 2. 最近答错
           * 3. 历史错误多
           */
          .sort(
            (
              a,
              b
            ) => {

              const statA =
                kanaStats[
                  a.kana
                ];


              const statB =
                kanaStats[
                  b.kana
                ];


              if (
                statA.mastery !==
                statB.mastery
              ) {

                return (
                  statA.mastery -
                  statB.mastery
                );

              }


              if (
                statA.lastResult !==
                statB.lastResult
              ) {

                if (
                  statA.lastResult ===
                  "wrong"
                ) {
                  return -1;
                }


                if (
                  statB.lastResult ===
                  "wrong"
                ) {
                  return 1;
                }

              }


              return (
                statB.wrong -
                statA.wrong
              );

            }
          )

          .slice(
            0,
            8
          );


      if (
        weakItems.length ===
        0
      ) {

        weakListEl.textContent =
          "暂无";

        return;

      }


      weakListEl.innerHTML =
        "";


      weakItems.forEach(
        item => {

          const stat =
            kanaStats[
              item.kana
            ];


          const element =
            document.createElement(
              "div"
            );


          element.className =
            "weak-item";


          element.textContent =
            `${item.kana} ${item.roman} · 掌握 ${stat.mastery}/${MAX_MASTERY} · 错 ${stat.wrong}`;


          weakListEl.appendChild(
            element
          );

        }
      );

    }


    /* ========================================
       更新学习范围文字
       ======================================== */

    function updateSelectedInfo() {

      const items =
        getAvailableItems();


      const masteredCount =
        items.filter(
          item =>
            kanaStats[
              item.kana
            ].mastery ===
            MAX_MASTERY
        ).length;


      const dueCount =
        items.filter(
          item => {
            const nextReview =
              parseTimestamp(
                kanaStats[
                  item.kana
                ].nextReviewAt
              );

            return (
              nextReview > 0 &&
              nextReview <= Date.now()
            );
          }
        ).length;

      selectedInfoEl.textContent =
        `当前抽取 ${items.length} 个平假名 · 已掌握 ${masteredCount} 个 · 到期复习 ${dueCount} 个`;

      const selectedLabels =
        [...selectedGroups]
          .map(group => ({
            a: "あ",
            ka: "か",
            sa: "さ",
            ta: "た",
            na: "な",
            ha: "は",
            ma: "ま",
            ya: "や",
            ra: "ら",
            wa: "わ"
          })[group])
          .filter(Boolean);

      const rangeLabel =
        selectedLabels.length === 0
          ? "未选择范围"
          : selectedLabels.length <= 4
            ? selectedLabels.join("・")
            : `${selectedLabels.slice(0, 3).join("・")} 等 ${selectedLabels.length} 行`;

      const directionLabel =
        ({
          kanaToRoman: "假→罗",
          romanToKana: "罗→假",
          random: "随机双向"
        })[modeEl.value] || "假→罗";

      settingsSummaryEl.textContent =
        `${rangeLabel} · ${directionLabel} · ${answerModeEl.value === "input" ? "输入" : "自评"}`;

    }


    function markSettingsChanged() {
      settingsUpdatedAt =
        new Date().toISOString();
    }


    /* ========================================
       行选择
       ======================================== */

    groupButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const group =
              button.dataset.group;


            if (
              selectedGroups.has(
                group
              )
            ) {

              selectedGroups.delete(
                group
              );

            } else {

              selectedGroups.add(
                group
              );

            }


            syncGroupButtons();

            updateSelectedInfo();

            markSettingsChanged();

            saveState();

            nextCard();

          }
        );

      }
    );


    /* ========================================
       全选
       ======================================== */

    document
      .getElementById(
        "selectAll"
      )
      .addEventListener(
        "click",
        () => {

          selectedGroups =
            new Set([
              "a",
              "ka",
              "sa",
              "ta",
              "na",
              "ha",
              "ma",
              "ya",
              "ra",
              "wa"
            ]);


          syncGroupButtons();

          updateSelectedInfo();

          markSettingsChanged();

          saveState();

          nextCard();

        }
      );


    /* ========================================
       清空选择
       ======================================== */

    document
      .getElementById(
        "clearAll"
      )
      .addEventListener(
        "click",
        () => {

          selectedGroups.clear();


          syncGroupButtons();

          updateSelectedInfo();

          markSettingsChanged();

          saveState();

          nextCard();

        }
      );


    /* ========================================
       重置学习记录
       ======================================== */

    document
      .getElementById(
        "resetProgress"
      )
      .addEventListener(
        "click",
        () => {

          const resetTarget =
            currentUser
              ? "当前账号"
              : "游客";

          const isolationTip =
            currentUser
              ? "不会删除账号，也不会影响游客或其他账号的数据。"
              : "不会影响任何账号的本地缓存或云端记录。";

          const confirmed =
            window.confirm(
              `确定要重置${resetTarget}的学习记录吗？\n\n${isolationTip}\n当前选择的学习范围和设置会保留。`
            );


          if (
            !confirmed
          ) {
            return;
          }


          stats = {
            total: 0,
            correct: 0,
            wrong: 0
          };

          kanaStats =
            createDefaultKanaStats();

          syncCounters = {};
          dailyCounters = {};

          saveState();

          updateStats();

          updateSelectedInfo();

          nextCard();

        }
      );


    /* ========================================
       显示答案按钮
       ======================================== */

    document
      .getElementById(
        "showAnswer"
      )
      .addEventListener(
        "click",
        showAnswer
      );


    /* ========================================
       不认识
       ======================================== */

    document
      .getElementById(
        "wrong"
      )
      .addEventListener(
        "click",
        () => {

          markAnswer(
            false
          );

        }
      );


    /* ========================================
       认识
       ======================================== */

    document
      .getElementById(
        "correct"
      )
      .addEventListener(
        "click",
        () => {

          markAnswer(
            true
          );

        }
      );


    answerFormEl.addEventListener(
      "submit",
      event => {
        event.preventDefault();
        submitTypedAnswer();
      }
    );

    dontKnowInputEl.addEventListener(
      "click",
      markTypedDontKnow
    );


    /* ========================================
       卡片点击
       ======================================== */

    cardEl.addEventListener(
      "click",
      () => {
        if (
          answerModeEl.value ===
          "input"
        ) {
          answerInputEl.focus();
          return;
        }

        showAnswer();
      }
    );


    /*
     * 键盘用户：
     * 卡片获得焦点后
     * Enter 也可显示答案。
     */
    cardEl.addEventListener(
      "keydown",
      event => {

        if (
          event.code ===
          "Enter" &&
          answerModeEl.value !==
            "input"
        ) {
          event.preventDefault();
          showAnswer();
        }

      }
    );


    /* ========================================
       账号事件
       ======================================== */

    accountTrigger.addEventListener(
      "click",
      openAuthModal
    );

    closeAuthModalButton.addEventListener(
      "click",
      closeAuthModal
    );

    authModal.addEventListener(
      "click",
      event => {
        if (
          event.target.matches(
            "[data-auth-close]"
          )
        ) {
          closeAuthModal();
        }
      }
    );

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Escape" &&
          !authModal.hidden
        ) {
          event.preventDefault();
          closeAuthModal();
        }
      }
    );

    window.addEventListener(
      "online",
      renderAuthState
    );

    window.addEventListener(
      "offline",
      renderAuthState
    );

    registerButton.addEventListener(
      "click",
      registerAccount
    );

    loginButton.addEventListener(
      "click",
      loginAccount
    );

    logoutButton.addEventListener(
      "click",
      logoutAccount
    );

    authEmailEl.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          event.preventDefault();
          loginAccount();
        }
      }
    );

    authPasswordEl.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          event.preventDefault();
          loginAccount();
        }
      }
    );


    /* ========================================
       设置变化
       ======================================== */

    modeEl.addEventListener(
      "change",
      () => {
        markSettingsChanged();
        saveState();
        updateSelectedInfo();
        nextCard();
      }
    );

    weightModeEl.addEventListener(
      "change",
      () => {
        markSettingsChanged();
        saveState();
        nextCard();
      }
    );

    answerModeEl.addEventListener(
      "change",
      () => {
        markSettingsChanged();
        saveState();
        updateSelectedInfo();
        nextCard();
      }
    );


    /* ========================================
       全局键盘快捷键
       ======================================== */

    document.addEventListener(
      "keydown",
      event => {

        /*
         * 输入账号、密码或操作表单时，
         * 不触发抽认卡快捷键。
         */
        const activeElement =
          document.activeElement;

        const tagName =
          activeElement
            ?.tagName
            ?.toLowerCase();

        if (
          [
            "input",
            "textarea",
            "select",
            "button"
          ].includes(tagName) ||
          activeElement?.isContentEditable
        ) {
          return;
        }

        if (
          answerModeEl.value ===
          "input"
        ) {
          return;
        }


        /*
         * 空格：
         * 显示答案
         */
        if (
          event.code ===
          "Space"
        ) {

          event.preventDefault();

          showAnswer();

        }


        /*
         * 左箭头：
         * 不认识
         */
        if (
          event.code ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          markAnswer(
            false
          );

        }


        /*
         * 右箭头：
         * 认识
         */
        if (
          event.code ===
          "ArrowRight"
        ) {

          event.preventDefault();

          markAnswer(
            true
          );

        }

      }
    );


    /* ========================================
       初始化 
       ======================================== */

    getOrCreateDeviceId();

    if (
      window.matchMedia?.(
        "(max-width: 600px)"
      ).matches
    ) {
      studySettingsEl.open = false;
    }

    const hasInitialLocalState =
      loadState(
        STORAGE_KEY
      );

    if (!hasInitialLocalState) {
      resetLearningState();
      refreshLearningUI();
    }

    initializeAuth();

  </script>

</body>
</html>
