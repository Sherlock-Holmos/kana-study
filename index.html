<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japanese Study">
  <meta name="description" content="假名、词汇、语法、汉字、阅读、听力、课程、SRS 复习与长期学习进度。">
  <title>Japanese Study v14 · N5 Production Ready</title>
  <link rel="manifest" href="./assets/manifest.29423720046c.webmanifest">
  <link rel="icon" href="./assets/icons/icon.f8cd6d005cff.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.0779a5c0b4f7.png">
  <link rel="stylesheet" href="./assets/css/app.73d4d400cb0f.css">
  <meta name="japanese-study-build" content="f83a6b23e834b85a">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button class="brand" type="button" data-route="home" aria-label="返回首页">
        <span class="brand-mark">日</span>
        <span><strong>Japanese Study</strong><small>N5 Production Ready · v14</small></span>
      </button>
      <nav class="top-nav" aria-label="主导航">
        <button class="active" type="button" data-route="home">首页</button>
        <button type="button" data-route="learn">学习</button>
        <button type="button" data-route="review">复习</button>
        <button type="button" data-route="library">内容库</button>
        <button type="button" data-route="progress">进度</button>
      </nav>
      <div class="header-actions">
        <button id="settingsTrigger" class="icon-button" type="button" title="设置" aria-label="设置">⚙</button>
        <button id="accountTrigger" class="account-trigger" type="button" aria-haspopup="dialog">
          <span class="account-avatar" data-account-avatar>人</span>
          <span class="account-name" data-account-text>登录</span>
          <i id="syncBadge" class="sync-badge" data-state="local" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <div id="updateBanner" class="update-banner" hidden role="status" aria-live="polite">
      <span><strong>新版本已就绪</strong> · 刷新后切换到最新构建，当前学习数据不会丢失。</span>
      <button class="primary" type="button" data-update-reload>刷新更新</button>
    </div>

    <main id="viewRoot" class="view-root" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="移动端主导航">
      <button class="active" type="button" data-route="home"><span>⌂</span><small>首页</small></button>
      <button type="button" data-route="learn"><span>学</span><small>学习</small></button>
      <button type="button" data-route="review"><span>复</span><small>复习</small></button>
      <button type="button" data-route="library"><span>庫</span><small>内容库</small></button>
      <button type="button" data-route="progress"><span>図</span><small>进度</small></button>
    </nav>
  </div>
  <div id="modalRoot" class="modal-root" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script>
    window.__showJapaneseStudyFatal = function (error) {
      console.error("Japanese Study 启动失败", error);
      const root = document.getElementById("viewRoot");
      if (!root || root.childElementCount) return;
      const message = error && (error.message || error.reason?.message)
        ? String(error.message || error.reason.message)
        : "前端模块加载失败";
      root.innerHTML = `
        <section class="panel fatal-state">
          <span class="eyebrow">加载异常</span>
          <h1>页面没有正常启动</h1>
          <p>${message.replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}</p>
          <button class="primary" type="button" onclick="location.reload()">重新加载</button>
        </section>`;
    };
    window.addEventListener("error", event => window.__showJapaneseStudyFatal(event.error || event.message));
    window.addEventListener("unhandledrejection", event => window.__showJapaneseStudyFatal(event.reason));
  </script>
  <script type="module">
    import("./assets/js/app.555523387331.js").catch(window.__showJapaneseStudyFatal);
  </script>
</body>
</html>
